<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07060d">
  <title>Ela'nın Doğum Günü Macerası</title>
  <meta name="description" content="Seviye 22 açıldı! Senin için küçük bir oyun.">
  <meta property="og:title" content="Ela'nın Doğum Günü Macerası 🎂">
  <meta property="og:description" content="Seviye 22 açıldı! Senin için küçük bir oyun hazırladım.">
  <meta property="og:image" content="https://starwww.dev/ela/og.png">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 6' shape-rendering='crispEdges'%3E%3Cpath fill='%23e04848' d='M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z'/%3E%3Cpath fill='%23ffd0d0' d='M1 1h1v1H1z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>
  <canvas id="fxc" aria-hidden="true"></canvas>

  <!-- Üst bilgi çubuğu -->
  <header id="hud" hidden>
    <button class="hud-cards" id="btn-cards" aria-label="Anı kartlarım">
      <span class="lbl">ANI<br>KARTI</span>
      <span id="hud-slots" class="slots"></span>
    </button>
    <button id="btn-sound" class="icon-btn" aria-label="Sesi kapat">
      <svg viewBox="0 0 10 9" shape-rendering="crispEdges" aria-hidden="true">
        <path fill="currentColor" d="M0 3h2V2h1V1h1V0h1v9H4V8H3V7H2V6H0z"/>
        <path class="waves" fill="currentColor" d="M6 3h1v3H6zM7 2h1v1H7zM7 6h1v1H7zM8 3h1v3H8z"/>
        <path class="cross" fill="currentColor" d="M6 2h1v1H6zM7 3h1v1H7zM8 2h1v1H8zM6 4h1v1H6zM8 4h1v1H8z"/>
      </svg>
    </button>
  </header>

  <!-- BAŞLIK -->
  <section id="title" class="screen">
    <p class="presents">★ GOKAN GAMES SUNAR ★</p>
    <h1 class="logo" aria-label="Ela"><span><i>E</i></span><span><i>L</i></span><span><i>A</i></span></h1>
    <p class="subtitle">DOĞUM GÜNÜ MACERASI</p>
    <p class="lvbadge">SEVİYE 22 AÇILDI!</p>
    <nav class="menu" id="title-menu"></nav>
    <p class="copyright">© 2026 GOKAN GAMES · 1 OYUNCU</p>
  </section>

  <!-- HARİTA -->
  <section id="map" class="screen">
    <div id="map-labels"></div>
    <p class="map-hint" id="map-hint"></p>
  </section>

  <!-- BÖLÜM 1 -->
  <section id="quiz" class="screen">
    <div class="panel quiz-panel" hidden>
      <div class="quiz-top"><span id="quiz-count"></span><span id="quiz-hearts" class="hearts"></span></div>
      <p id="quiz-q" class="quiz-q"></p>
      <div id="quiz-opts" class="quiz-opts"></div>
      <p id="quiz-react" class="quiz-react" aria-live="polite"></p>
    </div>
  </section>

  <!-- BÖLÜM 2 -->
  <section id="balloons" class="screen">
    <div class="bal-hud" id="bal-hud" hidden>
      <span class="chip" id="bal-count"></span>
      <span class="chip" id="bal-pops"></span>
    </div>
    <div class="panel bal-msg" id="bal-msg" hidden aria-live="polite">
      <p class="bal-msg-no" id="bal-msg-no"></p>
      <p class="bal-msg-text" id="bal-msg-text"></p>
      <button class="pbtn green" id="bal-done" hidden>TÜM MESAJLAR ✓ DEVAM ▶</button>
    </div>
  </section>

  <!-- BÖLÜM 3 -->
  <section id="cake" class="screen">
    <div class="cake-ui" id="cake-ui" hidden>
      <span class="chip" id="cake-count"></span>
      <button id="btn-mic" class="pbtn">🎤 MİKROFONLA ÜFLE</button>
      <div id="wind" class="wind" hidden><span>RÜZGÂR</span><div class="wind-track"><div id="wind-bar"></div></div></div>
      <p class="cake-hint">ya da mumlara dokunarak söndür</p>
    </div>
    <div class="wish" id="wish" hidden>
      <div class="wish-stars"><i></i><i></i><i></i></div>
      <p id="wish-text"></p>
    </div>
  </section>

  <!-- FİNAL -->
  <section id="final" class="screen">
    <h2 class="hbd"><span class="l1">İYİ Kİ DOĞDUN</span><span class="l2">ELOS!</span></h2>
    <div class="final-btns">
      <button class="pbtn" id="btn-letter">💌 MEKTUP</button>
      <button class="pbtn green" id="btn-album">📸 ANI ALBÜMÜ</button>
      <button class="pbtn brown" id="btn-song">🎵 ŞARKI</button>
    </div>
    <div class="final-foot">
      <p class="final-hint">gökyüzüne dokun, havai fişek at ✨</p>
      <button class="linkbtn" id="btn-restart">↺ başlık ekranına dön</button>
    </div>
  </section>

  <!-- Diyalog -->
  <div id="dlg-catch" hidden></div>
  <div id="dialog" class="dialog panel" hidden>
    <canvas id="dlg-portrait" width="16" height="16"></canvas>
    <div class="dlg-body">
      <p class="dlg-name" id="dlg-name"></p>
      <p class="dlg-text" id="dlg-text" aria-live="polite"></p>
    </div>
    <span class="dlg-next" aria-hidden="true">▼</span>
  </div>

  <div id="splash" class="splash" hidden><p class="splash-small"></p><p class="splash-big"></p></div>

  <!-- Anı kartı -->
  <div id="card" class="overlay" hidden>
    <div class="card-wrap">
      <p class="card-title" id="card-title"></p>
      <div class="card3d" id="card3d">
        <div class="card-inner">
          <div class="card-face card-back"><span class="q">?</span><span class="t">ANI KARTI</span></div>
          <div class="card-face card-front">
            <div class="card-head"><span>ANI KARTI</span><span id="card-no"></span></div>
            <canvas id="card-canvas"></canvas>
            <p class="card-note" id="card-note"></p>
          </div>
        </div>
      </div>
      <button class="pbtn" id="card-ok" hidden>KARTI AL ▶</button>
    </div>
  </div>

  <!-- Toplanan kartlar -->
  <div id="cards" class="overlay" hidden>
    <div class="sheet">
      <div class="sheet-head"><h3>ANI KARTLARIN</h3><button class="icon-btn" data-close="#cards" aria-label="Kapat">✕</button></div>
      <div class="grid" id="cards-grid"></div>
    </div>
  </div>

  <!-- Albüm -->
  <div id="album" class="overlay" hidden>
    <div class="sheet">
      <div class="sheet-head"><h3>ELA'NIN KAYIT DOSYALARI</h3><button class="icon-btn" data-close="#album" aria-label="Kapat">✕</button></div>
      <div class="grid" id="album-grid"></div>
    </div>
  </div>

  <!-- Büyük fotoğraf -->
  <div id="lightbox" class="overlay" hidden>
    <figure class="lb">
      <img id="lb-img" alt="">
      <figcaption><span id="lb-tag"></span><span id="lb-cap"></span></figcaption>
    </figure>
    <button class="icon-btn lb-nav" id="lb-prev" aria-label="Önceki">◀</button>
    <button class="icon-btn lb-nav" id="lb-next" aria-label="Sonraki">▶</button>
    <button class="icon-btn lb-x" id="lb-close" aria-label="Kapat">✕</button>
  </div>

  <!-- Mektup -->
  <div id="letter" class="overlay" hidden>
    <button class="envelope" id="envelope" aria-label="Zarfı aç">
      <span class="env-body"></span>
      <span class="env-flap"></span>
      <span class="env-seal">♥</span>
      <span class="env-tip">açmak için dokun</span>
    </button>
    <div class="letter-wrap">
      <article class="paper" id="paper" hidden>
        <div id="letter-text" class="letter-text"></div>
        <p class="sign" id="letter-sign" hidden></p>
      </article>
      <div class="letter-btns" id="letter-btns" hidden>
        <button class="pbtn brown" id="letter-skip">HEPSİNİ GÖSTER ⏩</button>
        <button class="pbtn" id="letter-close">KAPAT ✕</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="fade" class="fade"></div>
  <div id="devbar" hidden></div>

  <script src="config.js"></script>
  <script src="sprites.js"></script>
  <script src="audio.js"></script>
  <script src="main.js"></script>
</body>
</html>
